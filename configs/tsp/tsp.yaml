run:
  name: tsp_pop_5_gen_20_verbal_2
  output_dir: runs/tsp
  seed: 100

llm:
  provider: deepseek
  model: deepseek-v4-flash
  temperature: 0.7
  api_key_env: DEEPSEEK_API_KEY

evolution:
  population_size: 5
  generations: 20
  offspring_per_strategy: 1
  history:
    enabled: true
    max_size: 64
    max_per_bucket: 4
    add_statuses: [ valid, evaluated, timeout ]
    parent_sample_probability: 0.35
    s3_history_parent_min: 1
    final_selection_uses_history: true
    deduplicate_code: true
    diversity_weight: 0.25
    recency_weight: 0.05
    robustness_weight: 0.35
  verbal_gradients:
    enabled: true
    llm_every_n_generations: 2
    max_llm_calls_per_generation: 5
    llm_model: deepseek-v4-flash
    temperature: 0.3

evaluation:
  budget: 10000
  timeout_seconds: 300
  timeout_penalty: 0
  seeds: [ 100 ]
  metric: average_gap

data:
  search_instances: synthetic:tsp_construct:n_instance=20:n_cities=500:seed=2024
  test_instances: data/tsp/test_instances
