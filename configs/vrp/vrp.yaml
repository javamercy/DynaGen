run:
  name: vrp_calls_20
  output_dir: runs/vrp
  seed: 100

problem:
  type: vrp
  vrp_search_limit: 10
  vrp_test_sizes: [ 10, 20, 50, 100, 200 ]
  vrp_test_limit_per_size: 64

llm:
  provider: deepseek
  model: deepseek-v4-flash
  temperature: 0.7
  api_key_env: DEEPSEEK_API_KEY

evolution:
  population_size: 3
  generations: 5
  offspring_per_strategy: 1
  verbal_gradients:
    enabled: false
    llm_model: deepseek-v4-flash
    llm_every_n_generations: 2
    max_llm_calls_per_generation: 5
    temperature: 0.2
  history:
    enabled: false
    max_size: 64
    max_per_bucket: 4
    add_statuses: [ valid, evaluated, timeout ]
    parent_sample_probability: 0.35
    s3_history_parent_min: 1
    final_selection_uses_history: true
    deduplicate_code: true
    diversity_weight: 0.25
    recency_weight: 0.05
    robustness_weight: 0.35

evaluation:
  timeout_seconds: 180
  timeout_penalty: 0
  metric: mean_gap

data:
  search_instances: data/vrp/train/instances.pkl
  test_instances: data/vrp/test
