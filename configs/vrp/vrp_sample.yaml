# =============================================================================
# DynaGen VRP Sample Configuration — ALL available options with defaults
# =============================================================================

run:
  name: vrp_sample                     # Run name (used in output directory name)
  output_dir: runs/vrp                 # Base directory for run outputs
  seed: 100                            # Engine RNG seed (not optimizer seeds)

# ---------------------------------------------------------------------------
# Problem: VRP (Static Vehicle Routing Problem)
# ---------------------------------------------------------------------------
problem:
  type: vrp                            # bbob | tsp | dvrp | vrp
  vrp_search_limit: 10                 # Max instances for search pool
  vrp_test_sizes: [ 10, 20, 50, 100, 200 ]  # Customer-count sizes for test pool
  vrp_test_limit_per_size: 64          # Max test instances per size bucket

# ---------------------------------------------------------------------------
# LLM: Provider, model, budget, advanced options
# ---------------------------------------------------------------------------
llm:
  provider: deepseek                   # deepseek | openai | ollama | openrouter
  model: deepseek-v4-flash             # Model name (provider-specific)
  temperature: 0.7                     # LLM sampling temperature (0.0–2.0)
  api_key_env: DEEPSEEK_API_KEY        # Environment variable for API key

  # --- Optional: budget enforcement ---
  # llm_call_budget: 105               # Hard cap on candidate-generation LLM calls

  # --- Optional: DeepSeek reasoning depth (deepseek provider only) ---
  # reasoning_effort: high             # "high" or "max"

# ---------------------------------------------------------------------------
# Evolution: Core loop, strategies, history, verbal gradients, committee
# ---------------------------------------------------------------------------
evolution:
  population_size: 5                   # Number of candidates in the population
  generations: 20                      # Number of evolution generations
  offspring_per_strategy: 1            # Candidates generated per strategy per generation

  # --- Strategies — 5 available (2 exploration, 3 mutation) ---
  # strategies:                        # Explicit strategy list (default: all 5)
  #   - e1_radical_exploration
  #   - e2_backbone_exploration
  #   - m1_component_replacement
  #   - m2_parameter_schedule_mutation
  #   - m3_simplify_generalize

  # --- Strategy weights — per-strategy sampling probability (0.0–1.0) ---
  # strategy_weights:                  # Applied when history is empty (default: unweighted)
  #   m1_component_replacement: 0.3
  #   m2_parameter_schedule_mutation: 0.3

  # --- Archive-mode strategy weights — overrides from generation N onward ---
  # archive_mode_strategy_weights:     # Applied from gen >= after_generation
  #   m1_component_replacement: 0.4
  #   m2_parameter_schedule_mutation: 0.3
  #   m3_simplify_generalize: 0.2
  # archive_mode_strategy_weights_after_generation: 3   # when to activate (default 0 = immediate)
  # committee_recovery_strategies: [ e1_radical_exploration, e2_backbone_exploration, m1_component_replacement ]
  # niche_population_mix: false
  # archive_niche_replacement: true

  # --- History archive — persistent candidate store for parent sampling ---
  history:
    enabled: true                      # Enable/disable history archive
    max_size: 64                       # Maximum total entries
    max_per_bucket: 4                  # Max entries per bucket (size/trucks/source)
    add_statuses: [ valid, evaluated, timeout ]
    parent_sample_probability: 0.35    # Probability of sampling from history vs population
    s3_history_parent_min: 1           # Min history parents for E3_HYBRID_RECOMBINATION
    final_selection_uses_history: true # Whether final best can come from history
    deduplicate_code: true             # Reject candidates with identical code
    diversity_weight: 0.25             # Weight for diversity in history scoring
    recency_weight: 0.05               # Weight for recency in history scoring
    robustness_weight: 0.35            # Weight for robustness in history scoring

  # --- Verbal gradients — LLM reflection on parent performance ---
  verbal_gradients:
    enabled: true                      # Enable/disable LLM reflections
                                        #   WARNING: disable with committee_specialist
                                        #   (global parent feedback contradicts niche focus)
    llm_every_n_generations: 2         # Reflect every N generations
    max_llm_calls_per_generation: 5    # Max reflection calls per generation
    llm_model: deepseek-v4-flash       # Model for reflections (defaults to main model)
    temperature: 0.3                   # Temperature for reflection prompts

  # --- Committee mode — multi-specialist output ---
  # output_mode: single                # single (default) | committee_specialist | committee_loop
  # committee_size: 3                  # Number of specialists to maintain (N >= 1)
  # committee_test_budget: 1000        # Budget for test-time tryout (committee_loop)
  # niche:
  #   cadence_generations: 10
  #   improvement_weight: true
  #   improvement_power: 0.7

# ---------------------------------------------------------------------------
# Evaluation: Timeouts, seeds, metric
# ---------------------------------------------------------------------------
evaluation:
  timeout_seconds: 180                 # Wall-clock timeout per (instance×seed)
  timeout_penalty: 0.0                 # Penalty added to score for timeout fraction
  metric: mean_gap                     # Metric: mean_gap (distance gap to reference)

# ---------------------------------------------------------------------------
# Data: Instance paths (VRP-specific — pickle files)
# ---------------------------------------------------------------------------
data:
  search_instances: data/vrp/train/instances.pkl
  test_instances: data/vrp/test
